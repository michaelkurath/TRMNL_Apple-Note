---
strategy: webhook
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 2.3.7
serverless_language: node
refresh_interval_floor: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 191420
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  category: custom,personal
  description: Send any Apple Note to your TRMNL. Setup takes about a minute. Save the plugin, copy the Webhook URL below, then install the Apple Shortcut. The shortcut needs only the UUID, which is the part after the final slash of the Webhook URL.
  email_address: michael.kurath@gmail.com
  github_url: https://github.com/michaelkurath/TRMNL_Apple-Note
  learn_more_url: https://github.com/michaelkurath/TRMNL_Apple-Note#quick-setup
- keyname: webhook_url
  field_type: copyable_webhook_url
  name: 1. Copy your Webhook URL
  description: Save the plugin first, then copy this URL. Its UUID is the part after the final slash.
  help_text: Keep this URL private. Anyone with it can update your display.
- keyname: apple_note_shortcut
  field_type: copyable
  name: 2. Install the Apple Shortcut
  description: Open the <a href="https://www.icloud.com/shortcuts/f9cb583e81af4946a0cec64ebd0fea49" target="_blank" rel="noopener" class="underline">Apple Note shortcut</a>. During its first setup, enter only the UUID from the end of your Webhook URL.
  help_text: Afterwards, share any Apple Note to the shortcut.
  value: https://www.icloud.com/shortcuts/f9cb583e81af4946a0cec64ebd0fea49
- keyname: text_size
  field_type: select
  name: Text size
  description: Classic keeps the original left-aligned look. Maximise makes short notes fill more of the display.
  options:
  - Classic: classic
  - Maximise: maximise
  default: maximise
name: Apple Note
description: Send Apple Notes to your TRMNL
refresh_interval: 60
