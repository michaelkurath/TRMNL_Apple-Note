name: TRMNL

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        text-size: [classic, maximise]
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - uses: browser-actions/setup-firefox@v1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test webhook transform
        run: node --test test/transform.test.cjs

      - name: Install render dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo apt-get install --yes --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 imagemagick
          gem install trmnl_preview

      - name: Lint plugin
        run: trmnlp lint

      - name: Render length and empty-state fixtures
        shell: bash
        env:
          NOTE_MODE: ${{ matrix.text-size }}
        run: |
          set -euo pipefail
          mkdir -p _previews
          printf '\ncustom_fields:\n  text_size: %s\n' "$NOTE_MODE" >> .trmnlp.yml

          assert_mode() {
            for view in _build/*.html; do
              if ! grep -Fq "data-note-mode=\"$NOTE_MODE\"" "$view"; then
                echo "Expected $NOTE_MODE markup in $view" >&2
                return 1
              fi
            done
          }

          render_case() {
            case_name="$1"
            note="$2"
            sed -i "s|^  Note:.*|  Note: \"${note}\"|" .trmnlp.yml

            mkdir -p "_previews/${case_name}/og" "_previews/${case_name}/x"

            rm -rf _build
            trmnlp build --png --width 800 --height 480 --color-depth 1
            assert_mode
            cp _build/*.png "_previews/${case_name}/og/"

            rm -rf _build
            # TRMNL X reports a 1872x1404 panel and lays it out at 1040x780 CSS pixels.
            # Passing the physical panel size lets trmnlp select the X model profile,
            # including its lg breakpoint, 2x density, and capture scale.
            trmnlp build --png --width 1872 --height 1404 --color-depth 4
            assert_mode
            cp _build/*.png "_previews/${case_name}/x/"
          }

          render_case empty ""
          render_case tiny "OK"
          render_case short "Dinner at 7"
          render_case medium "Please remember to bring the blue folder and call me when you arrive."
          long_note="$(node -e 'const {readFileSync} = require("node:fs"); const {runInNewContext} = require("node:vm"); const run = runInNewContext(readFileSync("src/transform.js", "utf8") + "\nrun"); const Note = "Please remember to bring the blue folder and call me when you arrive. ".repeat(2000); process.stdout.write(run({Note}).Note);')"
          render_case long "$long_note"

      - name: Upload render previews
        uses: actions/upload-artifact@v6
        with:
          name: apple-note-previews-${{ matrix.text-size }}
          path: _previews
          if-no-files-found: error
